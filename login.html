<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>LR GamerShop — Iniciar sesión</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hdr">
    <div class="container navbar">
      <div class="brand">
        <img src="img/logo.png" alt="Logo LR GamerShop" class="logo-img">
        <div class="brand__name">LR GamerShop</div>
      </div>
      <nav class="nav" aria-label="Principal">
        <a href="index.html">Inicio</a>
        <a href="productos.html">Productos</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="contacto.html">Contáctanos</a>
        <a class="btn--ghost active" href="login.html">Iniciar sesión</a>
      </nav>
      <button id="burger" class="burger btn" aria-expanded="false" aria-controls="drawer">Menú</button>
    </div>
  </header>

  <!--Formulario para iniciar sesion-->
  <main class="section">
    <div class="container">
      <h1 class="section-title">Iniciar sesión</h1>
      <div class="card" style="max-width:420px; padding:1.2rem;">
        <form action="login.php" method="POST">
          <label for="correo">Correo</label>
          <input id="correo" name="correo" type="email" required />
          <label for="clave">Contraseña</label>
          <input id="clave" name="clave" type="password" required />
          <button class="btn" type="submit">Entrar</button>
        </form>
      </div>
    </div>
  </main>

  <footer>
    <div class="container footer__inner">
      <p>© 2025 LR GamerShop. Todos los derechos reservados.</p>
      <aside class="redes">
        <a href="https://www.facebook.com" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
        <a href="https://www.twitter.com" aria-label="Twitter"><i class="bi bi-twitter"></i></a>
        <a href="https://www.youtube.com" aria-label="YouTube"><i class="bi bi-youtube"></i></a>
      </aside>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
